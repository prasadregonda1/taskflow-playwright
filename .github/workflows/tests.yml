name: TaskFlow automation
on:
 push:
 pull_request:
 workflow_dispatch:
jobs:
 regression:
  runs-on: ubuntu-latest
  timeout-minutes: 15
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: 22
      cache: npm
   - run: npm ci
   - run: npm run typecheck
   - run: npx playwright install --with-deps chromium --only-shell
   - run: npm test
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: taskflow-test-results
      path: |
       playwright-report/
       test-results/
      retention-days: 14
